server:
  port: 8081

spring:
  application:
    name: assistant-mcp-server
  ai:
    mcp:
      server:
        name: wuji-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: "Wuji assistant MCP sample tools (echo_ping, get_weather)"
        capabilities:
          tool: true

wuji:
  mcp:
    auth:
      # 本地默认关闭；生产请设 true，并用环境变量注入密钥
      enabled: ${WUJI_MCP_AUTH_ENABLED:true}
      api-key: ${WUJI_MCP_API_KEY:alibaba}

logging:
  level:
    root: INFO
    com.wuji.assistant: INFO
