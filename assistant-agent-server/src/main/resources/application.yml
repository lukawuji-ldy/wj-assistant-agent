server:
  port: 8080
  netty:
    # 非流式 /api/chat 在 LLM 完成前不写 body，避免空闲断开
    idle-timeout: 10m

spring:
  application:
    name: assistant-agent-server
  # Boot 3.4 默认 RestClient 走 Reactor Netty；与 WebFlux + ReactAgent.block 叠用会 InterruptedException
  http:
    client:
      factory: jdk
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/vector_test
    username: postgres
    password: 1234567890
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    mcp:
      client:
        enabled: ${wuji.mcp.enabled:false}
        request-timeout: 20s
        # 禁止启动时同步 initialize：MCP Server 未起/不可达时不应拖垮 Agent 进程
        # 工具发现由 McpToolRegistry 延迟执行，失败则空工具 + 定时重试
        initialized: false
        # SSE URL / Bearer 由 McpClientTransportConfiguration（wuji.mcp.* / DB）装配，避免重复建连
  elasticsearch:
    uris: ${wuji.rag.elasticsearch.uris}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      # 先修改为0.0，不做采样跟踪
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.0}
  otlp:
    tracing:
      # 无 collector 时导出失败不阻断启动；可用 OTEL_EXPORTER_OTLP_ENDPOINT 覆盖
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}

wuji:
  scheduler:
    db:
      thread-cap: 20
      queued-task-cap: 1000
    chat-tail:
      thread-cap: 16
      queued-task-cap: 5000
    kb-ingest:
      thread-cap: 4
      queued-task-cap: 100
    llm-call:
      thread-cap: 32
      queued-task-cap: 500
  security:
    jwt:
      secret: ${WUJI_JWT_SECRET:change-me-wuji-assistant-jwt-secret-key-32b}
      expire-hours: 72
      issuer: wuji-assistant
    api-key-secret: ${WUJI_API_KEY_SECRET:change-me-wuji-api-key-secret-32bytes!!}
  model:
    primary-config-id: llm_primary
    fallback-config-ids:
      - llm_backup_1
    retry:
      max-attempts: 3
      backoff: 1s
    timeout: 60s
    rate-limit-codes: [429]
    api-key-override: ${WUJI_LLM_API_KEY:}
  agent:
    id: default
    max-tool-rounds: 8
    max-model-calls: 16
    system-prompt-code: agent.default.system
    user-prompt-code: agent.default.user
    checkpoint:
      type: postgres
      # 表由 schema/14_checkpoint.sql / Flyway V2 管理；true 仅用于空库且未跑迁移时
      create-tables: false
      host: 127.0.0.1
      port: 5432
      database: vector_test
      username: postgres
      password: ${spring.datasource.password}
    stream:
      heartbeat-interval: 15s
      resume-buffer-events: 200
      resume-ttl: 10m
  rag:
    vector-backend: pgvector
    as-tool: true
    top-k: 5
    similarity-threshold: 0.72
    min-reliable-score: 0.5
    default-collection: kb_default
    answer-mode: grounded
    embedding-enabled: true
    embedding-config-id: llm_embedding
    # 批量入库/重建限速（单 chunk 刷新不限速）；遇 429 指数退避重试
    embedding:
      request-interval-ms: 1000
      max-retries-on-429: 8
      retry-backoff-ms: 2000
      retry-backoff-max-ms: 60000
    tool-description-prompt-code: rag.knowledge_retrieval.system
    answer-prompt-code: rag.answer.system
    domain-agent-prompt-code: rag.domain_agent.system
    prefetch-enabled: false
    # 多库路由默认关闭。开启前在 kb_collection 写入各 collection 的说明。
    router:
      enabled: false
      top-n: 2
      min-score: 0.6
    # 检索前查询改写默认关闭。失败或超时使用原问题。
    query-rewrite:
      enabled: false
      max-queries: 3
      timeout: 8s
      system-prompt-code: rag.query_rewrite.system
      user-prompt-code: rag.query_rewrite.user
      relation-prompt-code: rag.relation.system
    pgvector:
      rrf-rank-constant: 60
    chunk-size: 500
    chunk-overlap: 80
    min-chunk-length-to-keep: 50
    chapter-split-enabled: true
    splitter:
      section-title-mode: FULL_LINE
      keep-separator: APPEND
    preprocess:
      normalize-newlines: true
      strip-page-numbers: true
      merge-cjk-hard-wrap: true
      collapse-blank-lines: true
      trim-outside-chapters: false
      trailing-noise-markers:
        - 复制上面这段
    elasticsearch:
      uris: http://localhost:9200
      index-name: wuji-kb-chunk
      # dims 与 llm_config EMBEDDING 不一致时自动删建索引（须随后对 ACTIVE 版本重建向量）
      recreate-index-on-dimension-mismatch: true
      hybrid:
        # Basic 许可证可用：双路 BM25+kNN 后客户端 RRF（不调用集群 retriever.rrf）
        enabled: true
        bm25-size: 20
        knn-size: 20
        rrf-rank-constant: 60
      min-reliable-score: 0.35
  mcp:
    enabled: true
    server-url: http://127.0.0.1:8081
    sse-endpoint: /sse
    auth:
      enabled: ${WUJI_MCP_AUTH_ENABLED:true}
      api-key: ${WUJI_MCP_API_KEY:alibaba}
  memory:
    short:
      compress-message-threshold: 30
      keep-recent-messages: 5
      compress-token-threshold: 12000
      summary-llm-enabled: true
      summary-timeout: 20s
      summary-sync-enabled: false
      summary-sync-timeout: 5s
      summary-system-prompt-code: memory.summary.system
      summary-user-prompt-code: memory.summary.user
    router:
      mode: rule          # rule | hybrid（hybrid 失败降级 rule）
      timeout: 2s
      system-prompt-code: memory.retrieve.router.system
      user-prompt-code: memory.retrieve.router.user
    retrieve:
      top-k: 8
      weight-similarity: 0.5
      weight-confidence: 0.2
      weight-freshness: 0.2
      weight-importance: 0.2
      semantic-enabled: true
      semantic-top-k: 4
      semantic-min-score: 0.55
    extract:
      enabled: true
      async: true
      explicit-detect-enabled: true
      mode: hybrid
      system-prompt-code: memory.extract.system
      user-prompt-code: memory.extract.user
      timeout: 60s
      min-confidence: 0.55
    lifecycle:
      consolidate-enabled: true
      consolidate-cron: "0 0 3 * * ?"

logging:
  level:
    root: INFO
    com.wuji.assistant: INFO
