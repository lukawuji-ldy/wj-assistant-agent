server:
  port: 8080

spring:
  application:
    name: assistant-agent-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/vector_test
    username: postgres
    password: 1234567890
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    mcp:
      client:
        enabled: ${wuji.mcp.enabled:false}
        request-timeout: 20s
        # 禁止启动时同步 initialize：MCP Server 未起/不可达时不应拖垮 Agent 进程
        # 工具发现由 McpToolRegistry 延迟执行，失败则空工具 + 定时重试
        initialized: false
        # SSE URL / Bearer 由 McpClientTransportConfiguration（wuji.mcp.* / DB）装配，避免重复建连

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      # 先修改为0.0，不做采样跟踪
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.0}
  otlp:
    tracing:
      # 无 collector 时导出失败不阻断启动；可用 OTEL_EXPORTER_OTLP_ENDPOINT 覆盖
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}

wuji:
  security:
    jwt:
      secret: ${WUJI_JWT_SECRET:change-me-wuji-assistant-jwt-secret-key-32b}
      expire-hours: 72
      issuer: wuji-assistant
    api-key-secret: ${WUJI_API_KEY_SECRET:change-me-wuji-api-key-secret-32bytes!!}
  admin:
    security:
      jwt:
        secret: ${WUJI_ADMIN_JWT_SECRET:change-me-wuji-admin-jwt-secret-key-32bytes}
        expire-hours: 24
        issuer: wuji-assistant-admin
  model:
    primary-config-id: llm_primary
    fallback-config-ids:
      - llm_backup_1
    retry:
      max-attempts: 3
      backoff: 1s
    rate-limit-codes: [429]
    api-key-override: ${WUJI_LLM_API_KEY:}
  agent:
    id: default
    max-tool-rounds: 8
    max-model-calls: 16
    system-prompt-code: agent.default.system
    user-prompt-code: agent.default.user
    memory-window-size: 20
    checkpoint:
      type: postgres
      # 表由 schema/14_checkpoint.sql / Flyway V2 管理；true 仅用于空库且未跑迁移时
      create-tables: false
      host: 127.0.0.1
      port: 5432
      database: vector_test
      username: postgres
      password: ${spring.datasource.password}
    stream:
      heartbeat-interval: 15s
      resume-buffer-events: 200
      resume-ttl: 10m
  rag:
    as-tool: true
    top-k: 5
    similarity-threshold: 0.72
    min-reliable-score: 0.5
    default-collection: kb_default
    answer-mode: grounded
    embedding-enabled: true
    embedding-config-id: llm_embedding
    chunk-size: 500
    chunk-overlap: 80
    min-chunk-length-to-keep: 50
    chapter-split-enabled: true
  mcp:
    enabled: true
    server-url: http://127.0.0.1:8081
    sse-endpoint: /sse
    auth:
      enabled: ${WUJI_MCP_AUTH_ENABLED:true}
      api-key: ${WUJI_MCP_API_KEY:alibaba}
  memory:
    short:
      max-message-count: 20
      max-token: 8000
      compress-message-threshold: 30
      keep-recent-messages: 5
    router:
      mode: rule          # rule | hybrid（hybrid 失败降级 rule）
      timeout: 2s
      system-prompt-code: memory.retrieve.router.system
      user-prompt-code: memory.retrieve.router.user
    retrieve:
      top-k: 8
      weight-similarity: 0.5
      weight-confidence: 0.2
      weight-freshness: 0.2
      weight-importance: 0.2
      semantic-enabled: true
      semantic-top-k: 4
      semantic-min-score: 0.55
    extract:
      enabled: true
      async: true
      explicit-detect-enabled: true
      mode: hybrid
      system-prompt-code: memory.extract.system
      user-prompt-code: memory.extract.user
      timeout: 20s
      min-confidence: 0.55
    lifecycle:
      consolidate-enabled: true
      consolidate-cron: "0 0 3 * * ?"

logging:
  level:
    root: INFO
    com.wuji.assistant: INFO
